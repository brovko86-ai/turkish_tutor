name: on-demand-poll

on:
  schedule:
    # Минимально допустимый интервал в GitHub Actions.
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

concurrency:
  group: turkish-generation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install --no-cache-dir -r requirements.txt

      - name: Poll and maybe generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/poll_telegram.py

      - name: Commit
        if: always()
        run: |
          set -euo pipefail
          git config user.name "turkish-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "on-demand: $(date -u +%FT%TZ)"
          git push
