name: daily-training

on:
  schedule:
    # 03:00 UTC = 06:00 MSK (UTC+3). При смене часового пояса — поправить.
    - cron: '0 3 * * *'
  workflow_dispatch: {}

concurrency:
  # Общая группа с on_demand: генерации не пересекутся.
  group: turkish-generation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install --no-cache-dir -r requirements.txt

      - name: Generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_MODE: scheduled
        run: python scripts/generate.py

      - name: Commit
        if: always()
        run: |
          set -euo pipefail
          git config user.name "turkish-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "daily: training $(date -u +%F)"
          git push
